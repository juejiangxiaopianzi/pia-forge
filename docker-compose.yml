version: '3.9'
# 仅用于本地开发与小型自部署。
# 阿里云上推荐：用 RDS PostgreSQL 替代 db 服务，app 服务独立部署到 ECS / SAE / 轻量应用服务器。

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: pia
      POSTGRES_PASSWORD: pia_dev
      POSTGRES_DB: pia_forge
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pia"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pia:pia_dev@db:5432/pia_forge?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me-in-prod
    ports:
      - "3000:3000"

volumes:
  db_data:
